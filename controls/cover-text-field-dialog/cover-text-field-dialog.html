<dialog id="frontCoverFieldDialog" class="modal">
  <form method="dialog" class="modal-card">
    <h2 id="frontCoverFieldDialogTitle">Add Front Cover Text</h2>
    <p id="frontCoverFieldDialogNote" class="about-note">
      Choose another field from Book Info to place on the front cover.
    </p>
    <div
      id="frontCoverFieldDialogList"
      class="front-cover-field-dialog-list"
    ></div>
    <div class="front-cover-field-footer">
      <section class="front-cover-field-custom" aria-label="Add custom field">
        <input
          id="frontCoverFieldDialogCustomName"
          type="text"
          maxlength="80"
          placeholder="Field"
          aria-label="Custom field name"
        />
        <input
          id="frontCoverFieldDialogCustomValue"
          type="text"
          maxlength="240"
          placeholder="Value"
          aria-label="Custom field value"
        />
        <button type="button" id="frontCoverFieldDialogCustomAdd">Add</button>
      </section>
      <div class="modal-actions front-cover-field-dialog-actions">
        <button type="button" class="button-cancel" data-action="cancel">
          Cancel
        </button>
      </div>
    </div>
  </form>
</dialog>
