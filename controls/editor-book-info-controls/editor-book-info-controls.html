<dialog id="bookInfoRemoveDialog" class="modal">
  <form method="dialog" class="modal-card book-info-remove-dialog-card">
    <h2 id="bookInfoRemoveDialogTitle">Remove Field?</h2>
    <p id="bookInfoRemoveDialogBody" class="about-note"></p>
    <div id="bookInfoRemoveDialogUsageWrap" class="book-info-remove-dialog-usage" hidden>
      <strong>Used in</strong>
      <ul id="bookInfoRemoveDialogUsageList"></ul>
    </div>
    <div class="modal-actions">
      <button type="button" class="button-cancel" data-action="cancel">
        Cancel
      </button>
      <button type="button" data-action="confirm">
        Remove Field and References
      </button>
    </div>
  </form>
</dialog>
<dialog id="bookInfoAuthorDialog" class="modal">
  <form method="dialog" class="modal-card book-info-author-dialog-card">
    <h2>Authors</h2>
    <p class="about-note">
      Author order matters. The first named contributor is usually the primary voice
      readers and catalog users notice first, while the last position can also carry
      special weight in multi-contributor works. Keep authors in intentional order.
    </p>
    <div id="bookInfoAuthorDialogList" class="book-info-author-list"></div>
    <div class="book-info-author-dialog-actions">
      <button type="button" id="bookInfoAuthorDialogAdd">Add Person</button>
    </div>
    <div class="modal-actions">
      <button type="button" class="button-cancel" data-author-action="cancel">
        Cancel
      </button>
      <button type="button" data-author-action="save">Save Authors</button>
    </div>
  </form>
</dialog>
